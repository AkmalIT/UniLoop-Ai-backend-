services:
  - type: web
    name: uniloop-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/ai/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uniloop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_ENABLED
        value: "false"
      - key: SEED_DISPOSABLE
        value: "false"
      - key: LLM_PROVIDER
        value: ""
      - key: LLM_API_KEY
        value: ""
      - key: AWS_ENDPOINT_URL_S3
        value: ""
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_REGION
        value: ""

databases:
  - name: uniloop-db
    databaseName: uniloop
    user: uniloop
    plan: free
